[package]
name = "ztreamer"
version = "0.1.0"
edition = "2024"

[dependencies]
heed = { version = "0.22.1", default-features = false }
hex = "0.4"
prost = "0.14.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-stream = "0.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.4.13", features = ["util"] }
zakura-chain = { path = "../zakura/crates/zakura-chain" }
zakura-state = { path = "../zakura/crates/zakura-state", features = ["indexer"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3"
