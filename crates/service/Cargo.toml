[package]
name = "ztreamer-service"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
prost = "0.14.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14.6"
tower = { version = "0.4.13", features = ["util"] }
zakura-chain = { path = "../../../zakura/crates/zakura-chain" }
zakura-network = { path = "../../../zakura/crates/zakura-network" }
zakura-state = { path = "../../../zakura/crates/zakura-state", features = ["indexer"] }
ztreamer-indexer = { path = "../indexer" }
ztreamer-protocol = { path = "../protocol" }

[dev-dependencies]
tempfile = "3"
